name: Build Packages
on:
  workflow_dispatch: {}

jobs:
  Discover:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Find package folders
        id: find
        run: |
          pkgs=$(find . -maxdepth 2 -name PKGBUILD -printf '%h\n' \
            | sed 's|^\./||' \
            | jq -R -s -c 'split("\n")[:-1]')
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Found: $pkgs"

  Build:
    needs: Discover
    runs-on: ubuntu-26.04
    container: archlinux:latest
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.Discover.outputs.packages) }}
      fail-fast: true
      max-parallel: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Update system and install base tools
        run: |
          pacman -Syu --noconfirm
          pacman -Syu --noconfirm --needed base-devel git sudo gnupg
      - name: Set up unprivileged build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Make scripts executable
        run: chmod +x import-pgp-keys.sh
      - name: Import PGP keys required by this PKGBUILD
        run: su builder -c "cd '$GITHUB_WORKSPACE' && ./import-pgp-keys.sh"
      - name: Build ${{ matrix.pkg }}
        run: su builder -c "cd '$GITHUB_WORKSPACE/${{ matrix.pkg }}' && makepkg -sf --noconfirm --needed"
      - name: Upload ${{ matrix.pkg }} build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}
          path: ${{ matrix.pkg }}/*.pkg.tar.zst
          if-no-files-found: warn
