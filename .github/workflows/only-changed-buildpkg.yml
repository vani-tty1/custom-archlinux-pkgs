name: Build Modified PKGBUILD's only
on:
  push:
    paths:
      - '**/PKGBUILD'
  workflow_dispatch: {}

jobs:
  Discover:
    runs-on: ubuntu-26.04
    outputs:
      packages: ${{ steps.find.outputs.packages }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # need history to diff against the previous commit

      - name: Find changed package folders
        id: find
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
          else
            BEFORE="HEAD~1"
            AFTER="HEAD"
          fi

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            BEFORE=$(git rev-list --max-parents=0 HEAD)
          fi

          changed=$(git diff --name-only "$BEFORE" "$AFTER" -- '**/PKGBUILD' 'PKGBUILD')

          pkgs=$(echo "$changed" \
            | xargs -r -n1 dirname \
            | sed 's|^\./||' \
            | sort -u \
            | jq -R -s -c 'split("\n")[:-1]')

          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Changed PKGBUILD dirs: $pkgs"

  Build:
    needs: Discover
    if: needs.Discover.outputs.packages != '[]'
    runs-on: ubuntu-26.04
    container: archlinux:latest
    strategy:
      matrix:
        pkg: ${{ fromJson(needs.Discover.outputs.packages) }}
      fail-fast: true
      max-parallel: 1
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Update system and install base tools
        run: |
          pacman -Syu --noconfirm
          pacman -Syu --noconfirm --needed base-devel git sudo gnupg
      - name: Set up unprivileged build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      - name: Make scripts executable
        run: chmod +x import-pgp-keys.sh
      - name: Import PGP keys required by this PKGBUILD
        run: su builder -c "cd '$GITHUB_WORKSPACE' && ./import-pgp-keys.sh"
      - name: Build ${{ matrix.pkg }}
        run: su builder -c "cd '$GITHUB_WORKSPACE/${{ matrix.pkg }}' && makepkg -sfrc --noconfirm --needed"
      - name: Upload ${{ matrix.pkg }} build
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.pkg }}
          path: ${{ matrix.pkg }}/*.pkg.tar.zst
          if-no-files-found: warn
